name: Release

# Tag vX.Y.Z to build every Linux package for both architectures into a
# draft GitHub release. Publishing the draft is a manual step.
#
# Only the draft and publish jobs can write to the repository; the build
# jobs (which run package installs and downloads) get a read-only token and
# hand their files over as artifacts.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  GH_REPO: ${{ github.repository }}

jobs:
  draft:
    name: Draft release
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check the tag matches the app version
        run: |
          version="$(node -p 'require("./apps/desktop/package.json").version')"
          test "v${version}" = "${GITHUB_REF_NAME}" || { echo "tag ${GITHUB_REF_NAME} != v${version}"; exit 1; }
      - name: Create the draft (never touch a published release)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if draft="$(gh release view "$GITHUB_REF_NAME" --json isDraft -q .isDraft 2>/dev/null)"; then
            test "$draft" = true || { echo "${GITHUB_REF_NAME} is already published; tag a new version"; exit 1; }
          else
            gh release create "$GITHUB_REF_NAME" --draft --verify-tag --title "$GITHUB_REF_NAME" --notes ""
          fi

  package:
    name: Packages (${{ matrix.arch }})
    needs: draft
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            flatpak_arch: x86_64
            runner: ubuntu-24.04
          - arch: arm64
            flatpak_arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.x"
          cache-dependency-path: tools/askpass/go.sum
      - name: Install packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm flatpak flatpak-builder
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
      - run: pnpm install --frozen-lockfile
      - name: Fetch opencode and build the askpass helper
        run: |
          if [ "${{ matrix.arch }}" = x64 ]; then variants=linux-x64,linux-x64-baseline; else variants=linux-arm64; fi
          pnpm fetch:opencode --variants "$variants"
          pnpm build:helpers
      - name: AppImage, deb, rpm
        working-directory: apps/desktop
        run: |
          pnpm exec electron-vite build
          pnpm exec electron-builder --linux AppImage deb rpm --${{ matrix.arch }} --publish never
      # Ubuntu 24.04 blocks the unprivileged user namespaces bubblewrap
      # (flatpak-builder's sandbox) uses; allow them on this throwaway runner.
      - name: Allow bubblewrap's sandbox
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Flatpak
        working-directory: apps/desktop
        run: flatpak/build.sh ${{ matrix.flatpak_arch }}
      - name: Checksums
        working-directory: apps/desktop/release
        run: sha256sum *.AppImage *.deb *.rpm *.flatpak > SHA256SUMS-${{ matrix.arch }}.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: packages-${{ matrix.arch }}
          path: |
            apps/desktop/release/*.AppImage
            apps/desktop/release/*.deb
            apps/desktop/release/*.rpm
            apps/desktop/release/*.flatpak
            apps/desktop/release/SHA256SUMS-${{ matrix.arch }}.txt
          if-no-files-found: error
          retention-days: 3

  publish:
    name: Upload to the draft
    needs: package
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: packages-*
          merge-multiple: true
          path: dist
      - name: Upload (only while the release is still a draft)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          draft="$(gh release view "$GITHUB_REF_NAME" --json isDraft -q .isDraft)"
          test "$draft" = true || { echo "${GITHUB_REF_NAME} was published meanwhile; not replacing its files"; exit 1; }
          gh release upload "$GITHUB_REF_NAME" --clobber dist/*
